<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Čo uvarím z Chilli</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Čo uvarím">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f3f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141916" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>
/* Phone: two screens switched by a bottom tab bar. Tablet (>=768px): both side by side. Recipe detail opens as a sheet. */
:root{
  --bg:#f3f5f1; --surface:#ffffff; --line:#d9ded6; --fg:#1d2420; --muted:#5d6a62;
  --have:#2f6b45; --have-bg:#dcebdf; --chili:#b8322a; --chili-bg:#f7e1de; --accent:#b8322a;
  --chip:#e8ebe5; --bar:rgba(243,245,241,.92); --scrim:rgba(0,0,0,.35);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --display:ui-rounded,-apple-system,"SF Pro Rounded","Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#141916; --surface:#1c231f; --line:#2f3832; --fg:#e7ece8; --muted:#9aa79f;
  --have:#8fd0a3; --have-bg:#1f3a2a; --chili:#ff8a7e; --chili-bg:#3d1f1c; --accent:#ff8a7e;
  --chip:#252d28; --bar:rgba(20,25,22,.92); --scrim:rgba(0,0,0,.6); color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 var(--font);-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
button{font:inherit;color:inherit;cursor:pointer}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto}
header{padding:calc(var(--sat) + 10px) 16px 8px;background:var(--bg)}
h1{font:800 26px/1.1 var(--display);margin:0;letter-spacing:-.01em}
h1 em{font-style:normal;color:var(--accent)}
.sub{color:var(--muted);font-size:13.5px;margin-top:2px}
main{min-height:0;display:grid}
.pane{min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px calc(24px + var(--sab))}
.pane[hidden]{display:none!important}
nav.tabbar{display:flex;border-top:1px solid var(--line);background:var(--bar);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);padding-bottom:var(--sab)}
.tb{flex:1;border:0;background:none;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);position:relative}
.tb svg{width:26px;height:26px}
.tb[aria-selected="true"]{color:var(--accent)}
.badge{position:absolute;top:4px;left:calc(50% + 8px);background:var(--have);color:var(--bg);font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;padding:0 5px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
@media (min-width:768px){
  main{grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:0}
  .pane[hidden]{display:block!important}
  #p-pick{border-right:1px solid var(--line)}
  nav.tabbar{display:none}
  .app{grid-template-rows:auto 1fr}
  .pane{padding-bottom:calc(24px + var(--sab))}
}
/* picker */
.tools{display:flex;gap:8px;margin:6px 0 10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;min-height:38px}
.btn:active{opacity:.6}
.search{position:sticky;top:0;background:var(--bg);padding:6px 0 8px;z-index:2}
input[type=search]{width:100%;font:16px var(--font);padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);-webkit-appearance:none}
.sec{margin-top:16px}
.sec h3{font:700 12px/1 var(--font);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid transparent;background:var(--chip);border-radius:999px;padding:8px 14px;font-size:15px;line-height:1.15;min-height:38px;user-select:none;-webkit-user-select:none}
.chip[aria-pressed="true"]{background:var(--have-bg);color:var(--have);border-color:var(--have);font-weight:700}
.chip[aria-pressed="true"]::before{content:"✓ "}
.chip small{color:var(--muted);font-weight:400;margin-left:4px;font-size:12px;font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--muted);margin-top:18px}
/* results */
.filters{display:flex;gap:8px;overflow-x:auto;padding:6px 0 8px;margin:0 -16px;padding-inline:16px;scrollbar-width:none;position:sticky;top:0;background:var(--bg);z-index:2}
.filters::-webkit-scrollbar{display:none}
.seg{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14.5px;min-height:36px}
.seg[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.opt{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);margin:4px 0 0}
.opt input{width:20px;height:20px;accent-color:var(--have)}
.bucket{margin-top:20px}
.bucket h2{font:700 19px/1.2 var(--display);margin:0}
.bucket .bs{font-size:13px;color:var(--muted);margin-top:2px}
.list{display:grid;gap:10px;margin-top:10px}
@media (min-width:1100px){.list{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.card:active{transform:scale(.99)}
.card.ready{border-left:5px solid var(--have)}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.name{font:700 16.5px/1.25 var(--display)}
.nut{font-size:12.5px;color:var(--muted);white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.nut b{color:var(--fg)}
.meta{font-size:13px;color:var(--muted)}
.miss{display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:13px}
.m{background:var(--chili-bg);color:var(--chili);border-radius:6px;padding:2px 8px;font-weight:700}
.h{background:var(--have-bg);color:var(--have);border-radius:6px;padding:2px 8px;font-weight:700}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:18px;color:var(--muted);margin-top:16px}
/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88%;background:var(--surface);border-radius:18px 18px 0 0;z-index:11;transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:0 -8px 30px rgba(0,0,0,.18)}
.sheet.on{transform:none}
@media (min-width:768px){.sheet{left:50%;right:auto;width:min(620px,92vw);bottom:auto;top:50%;max-height:84%;border-radius:18px;transform:translate(-50%,-46%) scale(.98);opacity:0;pointer-events:none;transition:transform .2s,opacity .2s}.sheet.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0}
.sh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:10px 18px 8px}
.sh h2{font:800 21px/1.2 var(--display);margin:0}
.x{border:0;background:var(--chip);border-radius:50%;width:34px;height:34px;flex:none;font-size:18px;line-height:1}
.sb{overflow-y:auto;padding:0 18px calc(20px + var(--sab));-webkit-overflow-scrolling:touch}
.sb h4{font:700 12px/1 var(--font);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:16px 0 6px}
.ing{list-style:none;padding:0;margin:0}
.ing li{padding:7px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:baseline}
.ing li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--line);flex:none;transform:translateY(-1px)}
.ing li.ok::before{background:var(--have)}
.ing li.no::before{background:var(--chili)}
.sb p{margin:6px 0}
.yt{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--accent);color:var(--bg);text-decoration:none;font-weight:700;padding:10px 16px;border-radius:12px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Čo uvarím z <em>Chilli</em></h1>
    <div class="sub" id="sub"></div>
  </header>
  <main>
    <section class="pane" id="p-pick" aria-label="Mám doma">
      <div class="tools">
        <button class="btn" id="b-basic" type="button">+ základné zásoby</button>
        <button class="btn" id="b-clear" type="button">Vymazať</button>
      </div>
      <div class="search"><input type="search" id="q" placeholder="Hľadaj surovinu…" aria-label="Hľadaj surovinu" autocomplete="off"></div>
      <div id="groups"></div>
      <p class="note">Soľ, korenie a olej sú zaškrtnuté stále. Číslo = v koľkých receptoch surovina je. Recepty: Chilli Fitness (YouTube @chilli_fitness22).</p>
    </section>
    <section class="pane" id="p-res" aria-label="Recepty" hidden>
      <div class="filters" id="tabs">
        <button class="seg" data-k="" aria-pressed="true" type="button">Všetko</button>
        <button class="seg" data-k="ranajky" aria-pressed="false" type="button">Raňajky</button>
        <button class="seg" data-k="obed" aria-pressed="false" type="button">Obed</button>
        <button class="seg" data-k="vecera" aria-pressed="false" type="button">Večera</button>
        <button class="seg" data-k="snack" aria-pressed="false" type="button">Snack</button>
        <button class="seg" data-k="dezert" aria-pressed="false" type="button">Dezert</button>
      </div>
      <label class="opt"><input type="checkbox" id="onlyfull"> len s presnými gramážami</label>
      <div id="out"></div>
    </section>
  </main>
  <nav class="tabbar" role="tablist">
    <button class="tb" role="tab" data-p="p-pick" aria-selected="true" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2.5" width="14" height="19" rx="2.5"/><path d="M5 10h14M8.5 6v2M8.5 13v3"/></svg>
      Mám doma</button>
    <button class="tb" role="tab" data-p="p-res" aria-selected="false" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18a9 9 0 0 1-18 0Z"/><path d="M8 8c0-1.5 1-1.5 1-3M12 8c0-1.5 1-1.5 1-3M16 8c0-1.5 1-1.5 1-3"/></svg>
      Recepty<span class="badge" id="badge" hidden></span></button>
  </nav>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="st">
  <div class="grab"></div>
  <div class="sh"><h2 id="st"></h2><button class="x" id="sx" type="button" aria-label="Zavrieť">✕</button></div>
  <div class="sb" id="sb"></div>
</div>

<script>
const DATA = {"recipes":[{"id":"M8bzxi5bYMM","n":"Pizza chlebíky s mozzarellou a pestom","k":["vecera"],"d":1,"kc":null,"b":null,"i":["chlieb / chlebíky","mozzarella light","paradajky","pesto"],"s":["kváskový žitný chlebík (Breadway) 3 ks (55-60 g)","pesto zelené alebo červené 1/2 ČL na chlebík","mozzarella podľa chuti","rajčina podľa chuti","chilli papričky drvené podľa chuti"],"p":"Chlebíky natrieme pestom, poukladáme mozzarellu a rajčinu a posypeme chilli. Pečieme v teplovzdušnej fritéze s papierom na pečenie pri 180 °C asi 10 minút.","t":"Dá sa piecť aj v rúre, trochu dlhšie. Hotové za cca 13,5 min.","full":true},{"id":"qZrb4krvNgw","n":"Lenivé lasagne","k":["obed"],"d":5,"kc":380,"b":36,"i":["cestoviny","cottage cheese","eidam 30 %","hovädzie mleté","paradajková omáčka","soľ a korenie","sušený cesnak","údená paprika mletá"],"s":["hovädzie mleté do 20 % tuku 500 g","soľ 1 ČL","údená paprika mletá 1 ČL","korenie 1 ČL","cesnak sušený 1 ČL","paradajková omáčka s bazalkou 690 g","cottage cheese 1 balenie (celé)","voda cca 0,5 dl","lasagne plátky cca 6 ks","eidam strúhaný alebo plátkový 100 g"],"p":"Mäso orestujeme s korením, pridáme polovicu omáčky a necháme bublať asi 4 minúty. Do zapekacej misky (cca 25x20 cm) dáme zvyšnú omáčku, mäso, cottage cheese, vodu, nastrkáme lasagne cestoviny a posypeme syrom. Prikryté alobalom pečieme pri 175 °C 30-35 min, potom odokryjeme a pečieme ďalších 10-15 min.","t":"Sacharidy 23 g, tuk 16 g na dávku. Cottage cheese môže byť light. Bazalka sušená alebo čerstvá.","full":true},{"id":"yMJpuDeGW6A","n":"Mäsové tortilové špízy","k":["obed"],"d":3,"kc":450,"b":42,"i":["cibuľa","hovädzie mleté","skyr / grécky jogurt","soľ a korenie","sušený cesnak","tortilly","údená paprika mletá"],"s":["hovädzie mleté 20 % tuku 500 g","červená cibuľa malá 1 ks","soľ 1 ČL","čierne korenie 1 ČL","cesnak sušený 1 ČL","údená paprika mletá 1 ČL","tortila 3 ks","skyr alebo grécky jogurt biely pár lyžíc","korenie na tzatziki (cacik) podľa chuti"],"p":"Mäso zmi       `<button type="button" class="chip" data-i="${esc(i)}" aria-pressed="${sel.has(i)}">${esc(i)}<small>${DATA.freq[i]||""}</small></button>`).join("")}</div></div>`;
  }).join("") || `<p class="note">Žiadna surovina nezodpovedá „${esc(q)}“.</p>`;
}

function card(r, missing){
  const nut = (r.kc || r.b) ? `<div class="nut">${r.kc?`<b>${r.kc}</b> kcal`:""}${r.kc&&r.b?"<br>":""}${r.b?`<b>${r.b} g</b> bielk.`:""}</div>` : "";
  const meta = [r.k.map(k=>KN[k]).join(" · "), r.d ? `${r.d} ${r.d==1?"dávka":r.d<5?"dávky":"dávok"}` : ""].filter(Boolean).join(" — ");
  const miss = missing.length ? `<div class="miss">Chýba: ${missing.map(m=>`<span class="m">${esc(m)}</span>`).join("")}</div>`
                              : `<div class="miss"><span class="h">Máš všetko</span></div>`;
  return `<button type="button" class="card${missing.length?"":" ready"}" data-id="${esc(r.id)}">
    <div class="top"><span class="name">${esc(r.n)}</span>${nut}</div>
    <div class="meta">${esc(meta)}</div>${miss}</button>`;
}

function renderResults(){
  const rows = DATA.recipes.filter(r => r.i.length && (!cat || r.k.includes(cat)) && (!onlyFull || r.full))
    .map(r => { const missing = r.i.filter(i => !sel.has(i)); return {r, missing, haveN: r.i.length - missing.length}; });
  const buckets = [["Môžeš variť hneď","máš všetky hlavné suroviny",0],["Chýba 1 surovina","stačí rýchly nákup alebo zámena",1],["Chýba 2 suroviny","",2]];
  let html = "";
  for (const [title, sub, n] of buckets){
    const list = rows.filter(x => x.missing.length === n).sort((a,b) => b.haveN - a.haveN || (b.r.b||0) - (a.r.b||0));
    if (!list.length) continue;
    html += `<section class="bucket"><h2>${title}</h2><div class="bs">${list.length} receptov${sub?" · "+sub:""}</div><div class="list">${list.slice(0,40).map(x=>card(x.r,x.missing)).join("")}</div></section>`;
  }
  $("out").innerHTML = html || `<div class="empty">Žiadny recept, ktorému by chýbali najviac 2 suroviny. Pridaj suroviny v záložke Mám doma alebo zruš filter.</div>`;
  const ready = DATA.recipes.filter(r => r.i.length && r.i.every(i => sel.has(i))).length;
  $("badge").textContent = ready; $("badge").hidden = !ready;
  const n = [...sel].filter(i=>!PANTRY.has(i)).length;
  $("sub").textContent = `${n} surovín doma · ${ready} receptov hneď`;
}
const render = () => { renderGroups(); renderResults(); };

function openSheet(id){
  const r = byId[id]; if (!r) return;
  $("st").textContent = r.n;
  const nut = [r.kc && `${r.kc} kcal`, r.b && `${r.b} g bielkovín`, r.d && `${r.d} ${r.d==1?"dávka":r.d<5?"dávky":"dávok"}`].filter(Boolean).join(" · ");
  const missing = new Set(r.i.filter(i => !sel.has(i)));
  $("sb").innerHTML = `${nut?`<div class="meta">${esc(nut)} (na dávku)</div>`:""}
    ${missing.size?`<div class="miss" style="margin-top:8px">Chýba: ${[...missing].map(m=>`<span class="m">${esc(m)}</span>`).join("")}</div>`:`<div class="miss" style="margin-top:8px"><span class="h">Máš všetky hlavné suroviny</span></div>`}
    <h4>Suroviny</h4><ul class="ing">${r.s.map(s=>`<li>${esc(s)}</li>`).join("")}</ul>
    <h4>Postup</h4><p>${esc(r.p)}</p>
    ${r.t?`<h4>Tip</h4><p>${esc(r.t)}</p>`:""}
    ${r.full?"":`<p class="note">Pri niektorých surovinách nepovedala presné množstvo – pozri video.</p>`}
    <a class="yt" href="https://youtu.be/${esc(r.id)}" target="_blank" rel="noopener">▶ Pozrieť video</a>`;
  $("sb").scrollTop = 0;
  $("scrim").classList.add("on"); $("sheet").classList.add("on");
}
const closeSheet = () => { $("scrim").classList.remove("on"); $("sheet").classList.remove("on"); };

$("groups").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  const i = b.dataset.i; sel.has(i) ? sel.delete(i) : sel.add(i);
  b.setAttribute("aria-pressed", sel.has(i)); save(); renderResults();
});
$("out").addEventListener("click", e => { const c = e.target.closest(".card"); if (c) openSheet(c.dataset.id); });
$("tabs").addEventListener("click", e => {
  const b = e.target.closest(".seg"); if (!b) return; cat = b.dataset.k;
  document.querySelectorAll(".seg").forEach(t => t.setAttribute("aria-pressed", t === b)); renderResults();
});
$("onlyfull").addEventListener("change", e => { onlyFull = e.target.checked; renderResults(); });
$("q").addEventListener("input", e => { q = e.target.value; renderGroups(); });
$("b-basic").addEventListener("click", () => { BASIC.forEach(i => sel.add(i)); save(); render(); });
$("b-clear").addEventListener("click", () => { sel = new Set(PANTRY); save(); render(); });
document.querySelectorAll(".tb").forEach(t => t.addEventListener("click", () => {
  document.querySelectorAll(".tb").forEach(x => x.setAttribute("aria-selected", x === t));
  document.querySelectorAll(".pane").forEach(p => p.hidden = p.id !== t.dataset.p);
}));
$("scrim").addEventListener("click", closeSheet);
$("sx").addEventListener("click", closeSheet);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
// swipe down to close the sheet
let y0 = null;
$("sheet").addEventListener("touchstart", e => { if ($("sb").scrollTop <= 0) y0 = e.touches[0].clientY; }, {passive:true});
$("sheet").addEventListener("touchend", e => { if (y0 !== null && e.changedTouches[0].clientY - y0 > 80) closeSheet(); y0 = null; });
render();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
